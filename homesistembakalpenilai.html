<head>

        // Semak status login menggunakan localStorage

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Bakal Penilai Buku Teks</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        
        .shape-1 { width: 400px; height: 400px; background: #fdfbfb; top: -100px; left: -100px; }
        .shape-2 { width: 350px; height: 350px; background: #ebedee; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.05); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            border-radius: 2rem;
            width: 90%;
            max-width: 800px;
            padding: 3rem 2rem;
            position: relative;
            z-index: 10;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
            color: #334155;
            font-weight: 600;
            font-size: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .glass-btn:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
            color: #0284c7;
            border-color: #e0f2fe;
        }

        .glass-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        #notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            color: #0f172a;
            transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .show-notification {
            top: 40px !important;
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Kotak Notifikasi Tersuai -->

        <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="notif-text">Modul dipilih</span>
    </div>

    <div class="glass-card flex flex-col items-center">
        
        <!-- Logo / Ikon Pendidikan -->
        <div class="mb-6 bg-white/50 p-4 rounded-full shadow-inner border border-white/60">
            <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
        </div>

        <!-- Tajuk Utama -->
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-2 tracking-tight text-slate-800">
            Sistem Data Bakal Penilai

        <h2 class="text-xl md:text-2xl font-semibold text-center mb-10 text-blue-700 bg-white/30 px-6 py-1 rounded-full border border-white/40">

        <!-- Pautan telah ditukar menggunakan onclick navigasi() untuk paparkan notifikasi dahulu -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full px-4">
            <button onclick="navigasi('https://izzatramlanmoe.github.io/datapenilaisbt/bakalpenilaikssr.html', 'Membuka pautan: KSSR')" class="glass-btn group relative border-none">
                <span class="relative z-10">KSSR</span>
                <span class="absolute bottom-4 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-20"></span>
            </button>
            
            <button onclick="navigasi('https://izzatramlanmoe.github.io/datapenilaisbt/bakalpenilaikssm.html', 'Membuka pautan: KSSM')" class="glass-btn group relative border-none">
                <span class="relative z-10">KSSM</span>
                <span class="absolute bottom-4 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-20"></span>
            </button>
            
            <button onclick="navigasi('https://izzatramlanmoe.github.io/datapenilaisbt/bakalpenilaikssrpk.html', 'Membuka pautan: KSSRPK')" class="glass-btn group relative border-none">
                <span class="relative z-10">KSSRPK</span>
                <span class="absolute bottom-4 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-20"></span>
            </button>
            
            <button onclick="navigasi('https://izzatramlanmoe.github.io/datapenilaisbt/bakalpenilaikssmpk.html', 'Membuka pautan: KSSMPK')" class="glass-btn group relative border-none">
                <span class="relative z-10">KSSMPK</span>
                <span class="absolute bottom-4 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-20"></span>
            </button>
        </div>

        <div class="w-full px-4 mt-8">
            <button onclick="navigasi('https://izzatramlanmoe.github.io/datapenilaisbt/bakalpenilaidemografi.html', 'Membuka pautan: DEMOGRAFI', true)" class="glass-btn group w-full !py-6 md:!py-8 !text-2xl md:!text-3xl bg-gradient-to-r from-blue-100/50 to-indigo-100/50 border-2 border-blue-300/60 shadow-lg hover:shadow-xl hover:bg-white/80">
                <span class="relative font-bold text-blue-900 tracking-wider">
                    DEMOGRAFI
                    <span class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-1.5 bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-300 group-hover:w-full rounded-full"></span>
                </span>
            </button>
        </div>

        <p class="mt-12 text-sm text-slate-500 font-medium tracking-wide">
            Sila pilih kurikulum atau demografi untuk meneruskan.
        </p>
    </div>

    <!-- SKRIP UNTUK FUNGSI HALAMAN & FIREBASE LOGOUT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyYourApiKeyHere...",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const INDEX_URL = "https://izzatramlanmoe.github.io/datapenilaisbt/index.html";

        // Fungsi log keluar
        window.logKeluar = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Ralat Firebase Logout:", error);
            }

            localStorage.removeItem("statusLogin");
            localStorage.removeItem("emailLogin");
            sessionStorage.removeItem("statusLogin");
            sessionStorage.removeItem("emailLogin");

            window.location.href = INDEX_URL;
        };

        // Auto log keluar selepas 10 minit
        let masaTamat;
        function mulaKiraan() {
            clearTimeout(masaTamat);
            masaTamat = setTimeout(window.logKeluar, 600000);
        }

        window.onload = mulaKiraan;
        document.onmousemove = mulaKiraan;
        document.onmousedown = mulaKiraan;
        document.ontouchstart = mulaKiraan;
        document.onclick = mulaKiraan;
        document.onkeypress = mulaKiraan;
        document.onscroll = mulaKiraan;
    </script>

    <!-- Skrip untuk notifikasi dan navigasi -->
    <script>
        let notifTimeout;

        function showNotification(message) {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notif-text');
            
            notifText.innerText = message;
            notif.classList.add('show-notification');
            
            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(() => {
                notif.classList.remove('show-notification');
            }, 3000);
        }

        // Fungsi khas supaya sistem sempat tunjuk kotak hijau sebelum redirect
        function navigasi(url, mesej, tabBaru = false) {
            showNotification(mesej);
            
            // Beri masa 800ms untuk pengguna lihat animasi sebelum beralih muka surat
            setTimeout(() => {
                if(tabBaru) {
                    window.open(url, '_blank');
                } else {
                    window.location.href = url;
                }
            }, 800);
        }
    </script>
</body>
