<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Update Maklumat Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Elemen Glass (Bekas Utama) */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        
        /* Kad Glass untuk Butiran Mata Pelajaran */
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255,255,255,1) inset;
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.5) 100%);
        }
        
        /* Modal Pop-up Glass */
        .glass-modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        /* Skrol khas untuk jadual panjang */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-teal-50 to-indigo-100 min-h-screen text-gray-800 antialiased relative">
    
    <!-- Latar Belakang Dekoratif Abstrak -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-teal-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-indigo-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-[-10%] left-[20%] w-96 h-96 bg-blue-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>

    <!-- Kontena Utama Aplikasi -->
    <div id="app" class="relative z-10"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgiKL_Mq-lMFWtuMxPIhV0JLjQbi_OhbexvewjAfLDpVn7jIWjn8qZBMUQZkioOz-8QgI-WFjjAJ53/pub?output=csv';
        
        let appData = {
            records: [],
            uniqueBengkel: [],
            filteredRecords: [],
            groupedBySubject: {},
            total: 0
        };
        let lastUpdated = '';
        let autoRefreshTimer;
        let currentBengkelFilter = 'Semua';

        /* Mulakan sistem */
        window.onload = () => {
            initApp();
        };

        async function initApp() {
            renderLoading();
            await fetchData(false);
            renderDashboardShell();
            updateDashboardData();
            
            // Sistem Auto Refresh setiap 15 saat (Penyegaran "Live")
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(async () => {
                await fetchData(true);
                // Kemas kini komponen jika modal tiada atau disembunyikan
                const modal = document.getElementById('modal');
                if (!modal || modal.classList.contains('hidden')) {
                    updateDashboardData();
                }
            }, 15000); 
        }

        async function fetchData(isSilent) {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Rangkaian terputus atau fail tidak wujud.');
                
                const csvText = await response.text();
                
                return new Promise((resolve, reject) => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            processData(results.data);
                            lastUpdated = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute:'2-digit', second:'2-digit' });
                            resolve();
                        },
                        error: (err) => reject(err)
                    });
                });
            } catch (err) {
                if (!isSilent) renderError(err);
                console.error("Fetch Data Error:", err);
            }
        }

        function processData(data) {
            // Format setiap rekod & seragamkan nama medan
            let tempRecords = data.map(row => {
                const keys = Object.keys(row);
                
                // Cari padanan TEPAT sahaja (contoh: "NAMA")
                const findExact = (targetNames) => {
                    for (let t of targetNames) {
                        let foundKey = keys.find(k => k.trim().toLowerCase() === t.toLowerCase());
                        if (foundKey && row[foundKey] && row[foundKey].trim() !== '') return row[foundKey];
                    }
                    return null;
                };

                // Cari padanan separa, tetapi boleh dikecualikan perkataan tertentu (cth: "penyelaras")
                const findFuzzy = (targetNames, excludeWords = []) => {
                    for (let t of targetNames) {
                        let foundKey = keys.find(k => {
                            let normalizedK = k.toLowerCase().trim();
                            let containsTarget = normalizedK.includes(t.toLowerCase());
                            let hasExclude = excludeWords.some(ex => normalizedK.includes(ex.toLowerCase()));
                            return containsTarget && !hasExclude;
                        });
                        if (foundKey && row[foundKey] && row[foundKey].trim() !== '') return row[foundKey];
                    }
                    return null;
                };

                // Ekstrak data rasmi
                const nama = findExact(['Nama', 'NAMA']) || findFuzzy(['Nama'], ['penyelaras', 'projek']) || 'Tiada Nama';
                const subjek = findExact(['Mata Pelajaran', 'Subjek']) || findFuzzy(['Mata Pelajaran', 'Subjek', 'Kursus']) || 'Tidak Dinyatakan';
                const bengkel = findExact(['Tempat Bengkel', 'Tempat', 'Bengkel']) || findFuzzy(['tempat', 'bengkel', 'lokasi']) || 'Tidak Dinyatakan';
                const timestamp = findExact(['Timestamp']) || findFuzzy(['timestamp', 'masa', 'tarikh']) || '-';
                
                return {
                    nama: nama,
                    subjek: subjek,
                    bengkel: bengkel,
                    timestamp: timestamp,
                    status: 'Telah Mengisi'
                };
            });

            appData.records = tempRecords;
            
            // Dapatkan senarai tempat bengkel yang unik untuk Dropdown Filter
            const bengkelSet = new Set(tempRecords.map(r => r.bengkel));
            appData.uniqueBengkel = Array.from(bengkelSet).filter(b => b && b !== 'Tidak Dinyatakan').sort();
            
            applyFilter(currentBengkelFilter);
        }

        function applyFilter(bengkel) {
            currentBengkelFilter = bengkel;
            
            if (bengkel === 'Semua') {
                appData.filteredRecords = [...appData.records];
            } else {
                appData.filteredRecords = appData.records.filter(r => r.bengkel === bengkel);
            }
            
            appData.total = appData.filteredRecords.length;
            appData.groupedBySubject = {};
            
            // Kumpulan rekod yang telah difilter mengikut Subjek
            appData.filteredRecords.forEach(record => {
                const subjek = record.subjek;
                if (!appData.groupedBySubject[subjek]) appData.groupedBySubject[subjek] = [];
                appData.groupedBySubject[subjek].push(record);
            });
        }

        // Penukar tarikh/masa Google Format
        function formatDateTime(timestamp) {
            if(!timestamp || timestamp === '-') return '-';
            
            let date = new Date(timestamp);
            
            // Pengendalian alternatif jika format tarikh bermasalah
            if (isNaN(date.getTime())) {
                // Cuba handle format DD/MM/YYYY HH:MM:SS (Standard Google Forms Msia)
                const dateParts = timestamp.split(/[\s,]+/);
                if(dateParts.length >= 2) {
                    const dateStr = dateParts[0];
                    const timeStr = dateParts.slice(1).join(' ');
                    
                    const dParts = dateStr.split(/[\/-]/);
                    if(dParts.length === 3) {
                         // Andaikan format DD/MM/YYYY
                         const day = parseInt(dParts[0], 10);
                         const month = parseInt(dParts[1], 10) - 1; // Bulan 0-index
                         const year = parseInt(dParts[2], 10);
                         
                         // cuba parse masa
                         let hours = 0, minutes = 0;
                         const tMatch = timeStr.match(/(\d+):(\d+)/);
                         if(tMatch) {
                             hours = parseInt(tMatch[1], 10);
                             minutes = parseInt(tMatch[2], 10);
                             if(timeStr.toLowerCase().includes('pm') && hours < 12) hours += 12;
                             if(timeStr.toLowerCase().includes('am') && hours === 12) hours = 0;
                         }
                         
                         date = new Date(year, month, day, hours, minutes);
                    }
                }
            }
            
            // Jika masih gagal, pulangkan raw string sahaja
            if(isNaN(date.getTime())) return `<div class="text-xs text-gray-700">${timestamp}</div>`;
            
            const days = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const dayName = days[date.getDay()];
            const dateStr = date.toLocaleDateString('ms-MY');
            const timeStr = date.toLocaleTimeString('ms-MY', { hour: '2-digit', minute:'2-digit' });

            return `<div><span class="font-semibold text-gray-700">${dayName}</span>, ${dateStr}</div><div class="text-xs text-indigo-600 font-bold mt-0.5">${timeStr}</div>`;
        }

        function renderDashboardShell() {
            const container = document.getElementById('app');
            
            // Jana pilihan HTML untuk dropdown tempat bengkel
            let bengkelOptions = `<option value="Semua">Tapis: Semua Tempat Bengkel</option>`;
            appData.uniqueBengkel.forEach(b => {
                let selected = currentBengkelFilter === b ? 'selected' : '';
                bengkelOptions += `<option value="${b}" ${selected}>${b}</option>`;
            });
            
            container.innerHTML = `
                <div class="max-w-7xl mx-auto p-4 sm:p-8 min-h-screen flex flex-col">
                    
                    <!-- Pengepala Utama -->
                    <div class="text-center mb-8 pt-4">
                        <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-indigo-700 mb-4 drop-shadow-sm pb-1">
                            Live Update Maklumat Panel
                        </h1>
                        <p class="text-gray-600 font-medium text-lg max-w-2xl mx-auto mb-5">
                            Sistem pemantauan status kehadiran / pendaftaran secara masa nyata.
                        </p>
                        
                        <div class="inline-flex items-center justify-center px-4 py-2 glass rounded-full text-xs font-semibold text-indigo-700 shadow-sm border-indigo-100/50">
                            <span class="relative flex h-2.5 w-2.5 mr-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-teal-500"></span>
                            </span>
                            <span id="last-updated-time">Kemas kini terakhir: Memuatkan...</span>
                        </div>
                    </div>

                    <!-- Filter Dropdown Bengkel -->
                    <div class="flex justify-center mb-6 z-20 relative w-full max-w-md mx-auto">
                        <div class="relative w-full">
                            <select id="bengkel-filter" onchange="handleFilterChange(this.value)" class="w-full glass px-6 py-3.5 rounded-full text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer appearance-none shadow-sm transition-all hover:bg-white/60 text-center text-ellipsis pr-10">
                                ${bengkelOptions}
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-6 text-indigo-500">
                                <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Kad Jumlah Keseluruhan -->
                    <div class="glass rounded-3xl p-10 mb-10 flex flex-col items-center justify-center max-w-md mx-auto text-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                        <h2 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3 z-10">Jumlah Keseluruhan Borang</h2>
                        <div id="total-count" class="text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-700 to-teal-500 drop-shadow-lg z-10 transition-all duration-300">
                            -
                        </div>
                    </div>

                    <!-- Grid Pemilihan Mata Pelajaran -->
                    <div id="subject-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-12 flex-grow">
                        <!-- Dimuatkan menerusi JavaScript -->
                    </div>
                </div>
                
                <!-- Modal Struktur (Tersembunyi) -->
                <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 sm:p-6 opacity-0 transition-opacity duration-300">
                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
                    <div class="glass-modal rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col relative transform scale-95 transition-all duration-300" id="modal-content">
                        <!-- Kandungan Modal Akan Dimuatkan Di Sini -->
                    </div>
                </div>
            `;
        }

        function handleFilterChange(value) {
            applyFilter(value);
            updateDashboardData();
        }

        function updateDashboardData() {
            // Update total
            const totalEl = document.getElementById('total-count');
            if(totalEl) totalEl.innerText = appData.total;
            
            // Update timestamp
            const timeEl = document.getElementById('last-updated-time');
            if(timeEl) timeEl.innerText = 'Kemas kini terakhir: ' + lastUpdated;
            
            // Update Cards Grid
            const gridEl = document.getElementById('subject-grid');
            if(gridEl) {
                let html = '';
                const activeData = appData.groupedBySubject;
                const keys = Object.keys(activeData).sort();
                
                if(keys.length === 0) {
                    html = `<div class="col-span-full text-center py-10 text-gray-500 glass rounded-xl">Tiada rekod data dijumpai untuk pilihan ini.</div>`;
                } else {
                    keys.forEach(key => {
                        const count = activeData[key].length;
                        html += `
                            <div class="glass-card rounded-2xl p-6 cursor-pointer flex flex-col h-full group relative overflow-hidden" onclick="showGroupDetails('${key}')">
                                <div class="absolute -right-4 -top-4 w-24 h-24 bg-gradient-to-br from-teal-200/40 to-indigo-200/40 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                                <h3 class="text-xl font-bold text-gray-800 mb-6 group-hover:text-indigo-700 transition-colors leading-tight relative z-10 pr-4">${key}</h3>
                                <div class="flex items-end justify-between mt-auto relative z-10 border-t border-gray-200/50 pt-4">
                                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Telah Mengisi</span>
                                    <span class="text-4xl font-black text-teal-600 group-hover:scale-110 transition-transform origin-bottom-right">${count}</span>
                                </div>
                            </div>
                        `;
                    });
                }
                gridEl.innerHTML = html;
            }
            
            // Update pilihan pada dropdown tanpa re-render keseluruhan shell (jika data ter-update di belakang)
            const filterEl = document.getElementById('bengkel-filter');
            if(filterEl) {
                let bengkelOptions = `<option value="Semua">Tapis: Semua Tempat Bengkel</option>`;
                appData.uniqueBengkel.forEach(b => {
                    let selected = currentBengkelFilter === b ? 'selected' : '';
                    bengkelOptions += `<option value="${b}" ${selected}>${b}</option>`;
                });
                
                if (filterEl.innerHTML !== bengkelOptions) {
                    filterEl.innerHTML = bengkelOptions;
                }
            }
        }

        function showGroupDetails(groupName) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            
            const records = appData.groupedBySubject[groupName] || [];
            
            let rowsHTML = '';
            records.forEach((rec, index) => {
                const combinedDateTime = formatDateTime(rec.timestamp);
                
                rowsHTML += `
                    <tr class="border-b border-white/50 hover:bg-white/60 transition-colors">
                        <td class="py-4 px-4 text-sm text-gray-500 font-medium align-top">${index + 1}</td>
                        <td class="py-4 px-4 text-sm text-gray-900 font-bold align-top uppercase">${rec.nama}</td>
                        <td class="py-4 px-4 text-sm align-top leading-tight">${combinedDateTime}</td>
                        <td class="py-4 px-4 text-sm align-top">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-emerald-100 to-teal-100 text-emerald-800 border border-emerald-200 shadow-sm whitespace-nowrap">
                                ${rec.status}
                            </span>
                        </td>
                    </tr>
                `;
            });

            modalContent.innerHTML = `
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 sm:px-8 border-b border-white/60 bg-white/40 rounded-t-3xl backdrop-blur-md shrink-0">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-widest text-indigo-500 mb-1">
                            Senarai Mata Pelajaran
                        </p>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800 leading-tight">${groupName}</h2>
                        ${currentBengkelFilter !== 'Semua' ? `<p class="text-sm font-medium text-teal-600 mt-1"><span class="text-gray-500">Kumpulan Bengkel:</span> ${currentBengkelFilter}</p>` : ''}
                    </div>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 bg-white/50 hover:bg-white transition-colors p-2 sm:p-3 rounded-full shadow-sm focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <!-- Modal Body (Table) -->
                <div class="p-0 overflow-y-auto flex-1 custom-scrollbar relative">
                    <table class="min-w-full text-left border-collapse">
                        <thead>
                            <tr class="shadow-[0_1px_2px_rgba(0,0,0,0.05)] z-10 relative">
                                <th class="py-4 px-4 font-bold text-xs text-gray-500 uppercase tracking-wider text-left bg-white/50 sticky top-0 backdrop-blur-xl w-16">No.</th>
                                <th class="py-4 px-4 font-bold text-xs text-gray-500 uppercase tracking-wider text-left bg-white/50 sticky top-0 backdrop-blur-xl min-w-[150px]">NAMA</th>
                                <th class="py-4 px-4 font-bold text-xs text-gray-500 uppercase tracking-wider text-left bg-white/50 sticky top-0 backdrop-blur-xl min-w-[130px]">Tarikh & Masa</th>
                                <th class="py-4 px-4 font-bold text-xs text-gray-500 uppercase tracking-wider text-left bg-white/50 sticky top-0 backdrop-blur-xl w-32">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/40 bg-white/10">
                            ${rowsHTML}
                        </tbody>
                    </table>
                </div>
                
                <!-- Modal Footer -->
                <div class="p-4 sm:px-8 border-t border-white/60 bg-white/40 rounded-b-3xl shrink-0 flex justify-between items-center backdrop-blur-md">
                    <span class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Jana Auto</span>
                    <p class="text-sm text-gray-800 font-bold bg-white/60 px-4 py-2 rounded-full shadow-sm">Jumlah: <span class="text-indigo-600 text-lg">${records.length}</span> orang</p>
                </div>
            `;

            // Buka Modal & Animasi
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderLoading() {
            const container = document.getElementById('app');
            container.innerHTML = `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="flex flex-col items-center p-10 glass rounded-3xl shadow-xl shadow-indigo-100/50">
                        <div class="w-16 h-16 border-4 border-indigo-100 border-t-teal-500 rounded-full animate-spin mb-6"></div>
                        <p class="text-indigo-800 font-bold text-lg animate-pulse tracking-wide">Menyegerak Data...</p>
                    </div>
                </div>
            `;
        }

        function renderError(err) {
            const container = document.getElementById('app');
            container.innerHTML = `
                <div class="flex items-center justify-center min-h-screen p-4">
                    <div class="glass rounded-3xl p-8 max-w-lg w-full text-center border-t-4 border-red-400 bg-red-50/40 relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 text-red-100 opacity-20">
                            <svg class="w-48 h-48" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                        </div>
                        <div class="text-red-500 mb-6 flex justify-center relative z-10">
                            <div class="bg-red-100 p-4 rounded-full shadow-inner">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                        <h2 class="text-2xl font-bold text-red-700 mb-3 relative z-10">Ralat Rangkaian</h2>
                        <p class="text-red-600 mb-8 font-medium text-sm relative z-10">${err.message || 'Gagal memuat turun CSV.'}</p>
                        <button onclick="initApp()" class="px-8 py-3 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold rounded-full transition-all shadow-lg shadow-red-500/30 hover:shadow-red-500/50 transform hover:-translate-y-1 relative z-10">Cuba Semula Sekali Lagi</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
