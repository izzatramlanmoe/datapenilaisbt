<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Penilai Buku Teks | KPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Tetapan khusus untuk Google Sites (Full Page) */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        /* Tema Glass Cerah */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        
        .glass-button {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body class="w-full min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center p-4 sm:p-8 relative" 
      style="background-image: url('https://buddhify.com/wp-content/uploads/2018/07/iStock-689785084.jpg');">
    
    <!-- Lapisan kelabu/biru cair berserta kesan 'grayscale' untuk MEMBUANG 100% sebarang tona kekuningan/warm pada gambar latar -->
    <div class="absolute inset-0 bg-slate-100/60 z-0 backdrop-blur-[5px] backdrop-grayscale"></div>

    <main class="glass-panel w-full max-w-4xl rounded-[2rem] p-8 sm:p-12 md:p-16 relative z-10 flex flex-col items-center text-center mx-auto my-auto">
        
        <!-- Bahagian Tajuk Utama -->
        <div class="flex flex-col items-center mb-10 relative z-10 w-full">
            
            <p class="text-xs sm:text-sm md:text-base tracking-[0.15em] sm:tracking-[0.2em] font-bold text-blue-900 uppercase mb-3 text-center">
                Bahagian Sumber dan Teknologi Pendidikan
                <br/>
                Kementerian Pendidikan Malaysia
            </p>
            
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-gray-900 mb-6 drop-shadow-sm leading-tight">
                Sistem Data <br/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-600">Penilai Buku Teks</span>
            </h1>
            
            <p class="max-w-2xl text-gray-800 text-base sm:text-lg md:text-xl font-medium">
                Sila pilih kategori untuk mengakses sistem pengurusan data buku teks.
            </p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-3xl justify-center">
            
            <!-- Butang 1: Panel Penilai -->
            <a href="https://sites.google.com/moe.gov.my/datapenilaisbt/2026-panel-penilai" target="_blank" 
               class="glass-button flex-1 rounded-2xl p-6 sm:p-8 flex flex-col items-center group relative overflow-hidden text-gray-900 hover:text-blue-800">
                
                <!-- Kesan cahaya semasa hover -->
                <div class="absolute inset-0 bg-gradient-to-b from-blue-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <!-- Ikon Panel Penilai -->
                <div class="bg-blue-100/80 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform duration-300 shadow-sm border border-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-12 sm:w-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                
                <h2 class="text-xl sm:text-2xl font-bold mb-2 tracking-wide">PANEL PENILAI</h2>
                <p class="text-xs sm:text-sm text-blue-700 font-semibold group-hover:text-blue-900 transition-colors">Buka Tetingkap Baru &rarr;</p>
            </a>

            <!-- Butang 2: Bakal Penilai -->
            <a href="https://sites.google.com/moe.gov.my/datapenilaisbt/2024-2025-bakal-penilai" target="_blank" 
               class="glass-button flex-1 rounded-2xl p-6 sm:p-8 flex flex-col items-center group relative overflow-hidden text-gray-900 hover:text-teal-800">
                
                <!-- Kesan cahaya semasa hover -->
                <div class="absolute inset-0 bg-gradient-to-b from-teal-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <!-- Ikon Bakal Penilai -->
                <div class="bg-teal-100/80 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform duration-300 shadow-sm border border-teal-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-12 sm:w-12 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                </div>
                
                <h2 class="text-xl sm:text-2xl font-bold mb-2 tracking-wide">BAKAL PENILAI</h2>
                <p class="text-xs sm:text-sm text-teal-700 font-semibold group-hover:text-teal-900 transition-colors">Buka Tetingkap Baru &rarr;</p>
            </a>

        </div>

        <!-- Footer / Maklumat hak cipta -->
        <div class="mt-12 pt-6 border-t border-gray-400/30 w-full">
            <p class="text-gray-600 text-xs sm:text-sm font-medium">
                &copy; 2026 : Team Data SBT ; BSTP ; KPM.
            </p>
        </div>
    </main>

</body>
</html>
