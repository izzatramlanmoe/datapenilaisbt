<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login | Sistem Data Penilai Buku Teks</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shape {
            position: absolute;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.8;
            animation: float 6s ease-in-out infinite;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .shape2 {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.15);
            bottom: -150px;
            right: -100px;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation-delay: -3s;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            text-align: center;
            color: white;
            animation: slideUpFade 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-sizing: border-box;
            color: white;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .login-box button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.5s ease;
        }

        .login-box button:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .login-box button:hover::after {
            left: 200%;
        }

        .login-box button:active {
            transform: translateY(1px);
        }

        #mesej-ralat {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            display: none;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 500;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>

    <div class="login-box">
        <h1 style="font-size: clamp(14px, 4.5vw, 21px); font-weight: 700; margin-bottom: 10px; color: rgba(255,255,255,0.95); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;">SISTEM DATA PENILAI BUKU TEKS</h1>
        <div style="font-size: 12px; font-weight: 400; margin-top: 0; margin-bottom: 30px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.6;">
            SEKTOR PENGHASILAN BUKU TEKS<br>
            BAHAGIAN SUMBER DAN TEKNOLOGI PENDIDIKAN<br>
            KEMENTERIAN PENDIDIKAN
        </div>
        
        <h2 style="margin-bottom: 20px; font-size: 24px;">Log Masuk</h2>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Email (cth: admin@moe.gov.my)" required autocomplete="off">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Katalaluan" required>
        </div>
        
        <p id="mesej-ralat">Email atau Katalaluan salah!</p>
        
        <button id="btn-login">Log Masuk</button>
    </div>

    <!-- SKRIP FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ GANTIKAN DENGAN MAKLUMAT CONFIG FIREBASE PROJECT ANDA ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyDEWm-AHbEMJuNhON6hZk96wqWfn07-Vy0",
            authDomain: "data-penilai-eb50d.firebaseapp.com",
            projectId: "data-penilai-eb50d",
            storageBucket: "data-penilai-eb50d.firebasestorage.app",
            messagingSenderId: "1045070075543",
            appId: "1:1045070075543:web:8916364d9be36a6eb77bd2"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const btn = document.getElementById('btn-login');
        const mesejRalat = document.getElementById("mesej-ralat");

        // Semak status sesi automatik (Apabila membuka semula laman)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Pengguna telah dilog masuk
                localStorage.setItem("statusLogin", "berjaya");
                localStorage.setItem("emailLogin", user.email);
                sessionStorage.setItem("statusLogin", "berjaya");
                sessionStorage.setItem("emailLogin", user.email);
                window.location.href = "homepage.html";
            }
        });

        // Fungsi Proses Log Masuk Firebase
        async function logMasuk() {
            const emailInput = document.getElementById("email").value.trim();
            const passInput = document.getElementById("password").value;

            if (!emailInput || !passInput) {
                tunjukkanRalat("Sila isi Email dan Katalaluan!");
                return;
            }

            btn.innerHTML = "Memeriksa...";
            btn.style.pointerEvents = 'none';

            try {
                // Pengesahan log masuk melalui Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, emailInput, passInput);
                const user = userCredential.user;

                btn.innerHTML = "Berjaya!";
                btn.style.background = "rgba(40, 167, 69, 0.5)";
                mesejRalat.style.display = "none";

                // Simpan status dalam storage untuk kebolehoperasian sistem legacy
                localStorage.setItem("statusLogin", "berjaya");
                localStorage.setItem("emailLogin", user.email);
                sessionStorage.setItem("statusLogin", "berjaya");
                sessionStorage.setItem("emailLogin", user.email);

                setTimeout(() => {
                    window.location.href = "homepage.html";
                }, 500);

            } catch (error) {
                btn.innerHTML = "Log Masuk";
                btn.style.pointerEvents = 'auto';

                // Pemprosesan mesej ralat mesra pengguna mengikut Firebase Error Code
                let mesej = "Email atau Katalaluan salah!";
                if (error.code === 'auth/invalid-email') {
                    mesej = "Format email tidak sah!";
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    mesej = "Email atau Katalaluan salah!";
                } else if (error.code === 'auth/too-many-requests') {
                    mesej = "Terlalu banyak percubaan gagaI. Sila cuba sebentar lagi.";
                }

                tunjukkanRalat(mesej);
            }
        }

        function tunjukkanRalat(teks) {
            mesejRalat.innerText = teks;
            mesejRalat.style.animation = 'none';
            mesejRalat.offsetHeight; /* trigger reflow */
            mesejRalat.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';
            mesejRalat.style.display = "block";
        }

        // Event listener untuk butang dan kekunci Enter
        btn.addEventListener('click', logMasuk);

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                logMasuk();
            }
        });
    </script>

    <div class="footer-text">TEAM DATA.SBT.2026</div>
</body>
</html>
