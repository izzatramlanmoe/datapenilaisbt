<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .login-box h2 { text-align: center; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .login-box button:hover { background-color: #218838; }
        #mesej-ralat { color: red; font-size: 14px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Sila Login</h2>
        <!-- Tetapkan ID untuk setiap input -->
        <input type="email" id="email" placeholder="Email (cth: admin@web.com)" required>
        <input type="password" id="password" placeholder="Password (cth: 12345)" required>
        <p id="mesej-ralat">Email atau Password salah!</p>
        <button onclick="logMasuk()">Login</button>
    </div>

    <script>
        function logMasuk() {
            // 1. Ambil nilai yang ditaip oleh pengguna
            let emailInput = document.getElementById("email").value;
            let passInput = document.getElementById("password").value;

            // 2. Tetapkan email dan password rahsia anda di sini
            let emailBetul = "admin@web.com";
            let passBetul = "12345";

            // 3. Semak jika ia sepadan
            if (emailInput === emailBetul && passInput === passBetul) {
                // Berjaya: Simpan "kunci" dalam sessionStorage browser
                sessionStorage.setItem("statusLogin", "berjaya");
                // Hantar pengguna ke homepage
                window.location.href = "homepage.html";
            } else {
                // Gagal: Tunjukkan mesej ralat
                document.getElementById("mesej-ralat").style.display = "block";
            }
        }
    </script>
</body>
</html>
