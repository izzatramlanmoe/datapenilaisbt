<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORANG PANEL BAKAL PENILAI BUKU TEKS KPM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        blob: "blob 7s infinite",
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'slide-in': 'slideIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" },
                        },
                        fadeInUp: {
                            "0%": { opacity: 0, transform: "translateY(40px)" },
                            "100%": { opacity: 1, transform: "translateY(0)" }
                        },
                        slideIn: {
                            "0%": { opacity: 0, transform: "translateX(-20px)" },
                            "100%": { opacity: 1, transform: "translateX(0)" }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            overflow: hidden; /* Prevent scrolling from animated blobs */
            margin: 0;
            padding: 0;
        }

        /* Delay utilities for staggered animations */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-6 sm:p-12">

    <div class="absolute inset-0 w-full h-full overflow-hidden z-0">
        <!-- Top Left Pink Blob -->
        <div class="absolute top-0 -left-4 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob"></div>
        <!-- Top Right Purple Blob -->
        <div class="absolute top-0 -right-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob delay-200"></div>
        <!-- Bottom Center Blue Blob -->
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob delay-400"></div>
    </div>

    <div class="relative z-10 w-full max-w-4xl glass-panel rounded-3xl p-8 sm:p-12 text-center animate-fade-in-up">
        
        <div class="mb-10 opacity-0 animate-slide-in delay-100">
            <div class="inline-flex items-center justify-center p-3 mb-6 rounded-2xl bg-white/10 border border-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-200 via-white to-purple-200 leading-tight mb-4 tracking-tight drop-shadow-lg">
                BORANG PANEL BAKAL PENILAI <br/> BUKU TEKS KPM
            </h1>
            <p class="text-blue-100/70 text-sm sm:text-base font-medium tracking-wide">
                Sila pilih borang yang berkaitan mengikut peranan anda.
            </p>
        </div>

        <div class="flex flex-col gap-6 w-full max-w-2xl mx-auto">
            
            <!-- Button 1: Panel Sahaja -->
            <a href="https://sites.google.com/moe.gov.my/datapenilaisbt/borang-maklumat-penilai" 
               target="_blank" 
               rel="noopener noreferrer"
               class="glass-button group relative w-full flex flex-col sm:flex-row items-center justify-between p-6 sm:p-8 rounded-2xl text-left no-underline opacity-0 animate-slide-in delay-200 overflow-hidden">
                
                <!-- Hover light effect -->
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/0 via-blue-400/10 to-blue-500/0 transform -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                
                <div class="flex items-center gap-5 z-10 w-full sm:w-auto">
                    <div class="bg-blue-500/20 p-4 rounded-xl border border-blue-400/30 group-hover:scale-110 transition-transform duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-white font-bold text-lg sm:text-xl mb-1">Borang Maklumat Bakal Penilai</h2>
                        <p class="text-blue-200/80 text-xs sm:text-sm font-semibold uppercase tracking-wider">(Hanya Diisikan Oleh Panel Sahaja)</p>
                    </div>
                </div>
                <div class="z-10 mt-4 sm:mt-0 opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </div>
            </a>

            <!-- Button 2: Penyelaras Projek Sahaja -->
            <a href="https://sites.google.com/moe.gov.my/datapenilaisbt/pemarkahan-bakal-penilai" 
               target="_blank" 
               rel="noopener noreferrer"
               class="glass-button group relative w-full flex flex-col sm:flex-row items-center justify-between p-6 sm:p-8 rounded-2xl text-left no-underline opacity-0 animate-slide-in delay-300 overflow-hidden">
                
                <!-- Hover light effect -->
                <div class="absolute inset-0 bg-gradient-to-r from-purple-500/0 via-purple-400/10 to-purple-500/0 transform -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>

                <div class="flex items-center gap-5 z-10 w-full sm:w-auto">
                    <div class="bg-purple-500/20 p-4 rounded-xl border border-purple-400/30 group-hover:scale-110 transition-transform duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-white font-bold text-lg sm:text-xl mb-1">Borang Penilaian Panel Penilai</h2>
                        <p class="text-purple-200/80 text-xs sm:text-sm font-semibold uppercase tracking-wider">(Hanya Diisikan Oleh Penyelaras Projek Sahaja)</p>
                    </div>
                </div>
                <div class="z-10 mt-4 sm:mt-0 opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </div>
            </a>

        </div>
    </div>
</body>
</html>
